<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Tech Solution Chat Help</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#07111f;color:#edf4ff}button,input,select,textarea{font:inherit}.wrap{max-width:1180px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:22px;font-weight:800}.muted{color:#9eb0c9}.card{background:#101d31;border:1px solid #263b5e;border-radius:16px}.grid{display:grid;grid-template-columns:1fr 320px;gap:16px}.chat{min-height:650px;display:flex;flex-direction:column}.msgs{flex:1;padding:16px;overflow:auto;max-height:560px}.bubble{max-width:82%;padding:10px 12px;border-radius:14px;margin:8px 0;white-space:pre-wrap}.bot{background:#182943}.usr{background:#4d86ff;margin-left:auto}.compose{display:flex;gap:8px;border-top:1px solid #263b5e;padding:12px}.compose input,.field input,.field select,.field textarea{width:100%;background:#081424;color:white;border:1px solid #2c4368;border-radius:10px;padding:10px}.btn{border:0;border-radius:10px;padding:10px 13px;background:#4d86ff;color:white;font-weight:700;cursor:pointer}.btn.secondary{background:#21334f}.btn.danger{background:#c74e63}.choice{border:1px solid #365a8d;background:#132540;color:#fff;border-radius:10px;padding:9px 11px;margin:4px;cursor:pointer}.side{padding:14px}.info{border:1px solid #263b5e;border-radius:10px;padding:10px;margin:8px 0}.k{font-size:12px;color:#9eb0c9}.hidden{display:none!important}.login{max-width:430px;margin:60px auto;padding:20px}.admin{max-width:1400px;margin:auto;padding:14px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tab{background:#132540;color:white;border:1px solid #2c4368;border-radius:9px;padding:8px 10px;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.stat{padding:12px}.stat strong{font-size:24px}.panel{padding:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:8px;border-bottom:1px solid #263b5e;white-space:nowrap;text-align:left}.field{margin:10px 0}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:14px}.modalbox{width:min(760px,100%);max-height:90vh;overflow:auto;padding:18px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:900px){.grid{grid-template-columns:1fr}.side{display:none}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="customer" class="wrap">
  <div class="top"><div><div class="brand">Smart Tech Solution Chat Help</div><div class="muted">Customer Service & Device Support</div></div><button class="btn secondary" onclick="showLogin()">Admin</button></div>
  <div class="grid" style="margin-top:14px">
    <div class="card chat"><div id="msgs" class="msgs"></div><div class="compose"><input id="input" placeholder="Enter Serial Number or Model Number"><button class="btn" onclick="sendMsg()">Send</button></div></div>
    <div class="card side"><h3>Device</h3><div id="deviceBox" class="muted">Not verified</div><h3>Case</h3><div id="caseBox" class="muted">No active case</div></div>
  </div>
</div>

<div id="loginView" class="hidden"><div class="card login"><h2>Admin Login</h2><div class="field"><input id="adminEmail" type="email" placeholder="Admin email"></div><div class="field"><input id="adminPassword" type="password" placeholder="Password (10+ chars)"></div><div class="toolbar"><button class="btn" onclick="adminLogin()">Login</button><button class="btn secondary" onclick="bootstrapAdmin()">Create First Admin</button><button class="btn secondary" onclick="backCustomer()">Back</button></div><div id="loginMsg" class="muted"></div></div></div>

<div id="adminView" class="admin hidden">
  <div class="top"><div class="brand">Smart Tech Solution Chat Help — Admin</div><div><button class="btn secondary" onclick="backCustomer()">Customer</button> <button class="btn danger" onclick="logout()">Logout</button></div></div>
  <div id="stats" class="stats" style="margin-top:12px"></div><div id="tabs" class="tabs"></div><div class="card panel"><div id="content"></div></div>
</div>
<div id="modal" class="modal hidden"><div class="card modalbox"><div id="modalBody"></div></div></div>

<script>
const API='https://yywuwtturjqacbrayntq.supabase.co/functions/v1/smart-tech-solution-chat-help';
let token=localStorage.getItem('smartTechToken')||'';
let state={stage:'verify'}; let currentTab='dashboard';
const $=id=>document.getElementById(id); const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(action,data={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})},body:JSON.stringify({action,...data})});let j={};try{j=await r.json()}catch{}if(!r.ok||j.error)throw new Error(j.error||('HTTP '+r.status));return j}
function bubble(t,user=false){const d=document.createElement('div');d.className='bubble '+(user?'usr':'bot');d.textContent=t;$('msgs').appendChild(d);$('msgs').scrollTop=$('msgs').scrollHeight}
function choices(items,fn){const w=document.createElement('div');items.forEach(it=>{const b=document.createElement('button');b.className='choice';b.textContent=it.label;b.onclick=()=>{w.remove();fn(it)};w.appendChild(b)});$('msgs').appendChild(w)}
function initChat(){state={stage:'verify'};$('msgs').innerHTML='';bubble('नमस्कार! कृपया Serial Number किंवा Model Number टाका.');renderDevice();renderCase()}
async function sendMsg(){const i=$('input'),t=i.value.trim();if(!t)return;i.value='';bubble(t,true);try{if(state.stage==='verify')return verifyDevice(t);if(state.stage==='name'){state.name=t;state.stage='phone';return bubble('Mobile number टाका.')}if(state.stage==='phone'){state.phone=t;state.stage='email';return bubble('Email टाका किंवा skip लिहा.')}if(state.stage==='email'){state.email=t.toLowerCase()==='skip'?'':t;return startCase()}}catch(e){bubble('Error: '+e.message)}}
async function verifyDevice(q){const r=await api('verify_device',{query:q});if(!r.ok)return bubble(r.message||'Device not found');if(r.mode==='model'){bubble('Model सापडला. Warranty आणि service case साठी actual Serial Number टाका.');return}state.device=r.device;renderDevice();bubble('Device verified ✅\n'+(r.device.brand||'')+' '+(r.device.model_number||'')+'\nWarranty: '+r.device.warranty_status);const z=await api('list_issues',{device:r.device});const issues=z.data||[];if(!issues.length){state.issue={issue_title:prompt('Issue title लिहा')||'Other Issue',severity:'medium'};return askContact()}bubble('Issue select करा:');choices(issues.map(x=>({label:x.issue_title,x})).concat([{label:'Other Issue',x:null}]),async o=>{if(!o.x){state.issue={issue_title:prompt('Issue title लिहा')||'Other Issue',severity:'medium'};return askContact()}state.issue=o.x;const g=await api('get_guide',{guide_id:o.x.id});state.steps=g.steps||[];state.idx=0;askContact()})}
function askContact(){state.stage='name';bubble('Contact person चे नाव टाका.')}
async function startCase(){const r=await api('start_case',{device_id:state.device.id,issue_title:state.issue.issue_title,priority:state.issue.severity||'medium',contact_name:state.name,contact_phone:state.phone,contact_email:state.email});state.case=r.case;renderCase();bubble('Case '+state.case.case_number+' तयार झाली.');if(state.steps&&state.steps.length){state.stage='trouble';runStep()}else escalate()}
function runStep(){const s=state.steps[state.idx];if(!s)return solvedQuestion();bubble('Step '+s.step_order+': '+s.instruction);choices([{label:'Yes / Done',v:true},{label:'No',v:false}],async a=>{await api('log_message',{case_id:state.case.id,sender_type:'customer',message:'Step '+s.step_order+' response: '+(a.v?'yes':'no')});if(s.resolves_case&&a.v)return solvedQuestion();if(s.escalation_on_fail&&!a.v)return escalate();const next=a.v?s.yes_next_step:s.no_next_step;if(next){const j=state.steps.findIndex(x=>Number(x.step_order)===Number(next));state.idx=j>=0?j:state.idx+1}else state.idx++;runStep()})}
function solvedQuestion(){bubble('Issue solve झाला का?');choices([{label:'Yes, solved',v:true},{label:'No, support needed',v:false}],a=>a.v?resolveCase():escalate())}
async function resolveCase(){const r=await api('finish_case',{case_id:state.case.id,solved:true,resolution_summary:'Customer confirmed resolved'});state.case=r.case;renderCase();bubble('Case resolved म्हणून save झाली ✅');state.stage='done'}
async function escalate(){const r=await api('finish_case',{case_id:state.case.id,solved:false});state.case=r.case;renderCase();let t='Case Support Team कडे Open केली आहे.';if(r.support?.phone)t+='\nSupport: '+r.support.phone;if(r.support?.email)t+='\nEmail: '+r.support.email;bubble(t);state.stage='done'}
function renderDevice(){const d=state.device;$('deviceBox').innerHTML=d?[['Customer',d.company_name],['Category',d.category],['Brand',d.brand],['Model',d.model_number],['Serial',d.serial_number],['Warranty',d.warranty_status],['Warranty End',d.warranty_end||'-'],['AMC End',d.amc_end||'-']].map(x=>'<div class="info"><div class="k">'+esc(x[0])+'</div><b>'+esc(x[1]||'-')+'</b></div>').join(''):'Not verified'}
function renderCase(){const c=state.case;$('caseBox').innerHTML=c?'<div class="info"><div class="k">Case</div><b>'+esc(c.case_number)+'</b></div><div class="info"><div class="k">Status</div><b>'+esc(c.status)+'</b></div>':'No active case'}
function showLogin(){$('customer').classList.add('hidden');$('loginView').classList.remove('hidden')}
function backCustomer(){$('loginView').classList.add('hidden');$('adminView').classList.add('hidden');$('customer').classList.remove('hidden')}
async function bootstrapAdmin(){try{await api('bootstrap_admin',{email:$('adminEmail').value,password:$('adminPassword').value});$('loginMsg').textContent='First admin created. आता Login करा.'}catch(e){$('loginMsg').textContent=e.message}}
async function adminLogin(){try{const r=await api('admin_login',{email:$('adminEmail').value,password:$('adminPassword').value});token=r.token;localStorage.setItem('smartTechToken',token);$('loginView').classList.add('hidden');$('adminView').classList.remove('hidden');loadAdmin()}catch(e){$('loginMsg').textContent=e.message}}
function logout(){token='';localStorage.removeItem('smartTechToken');backCustomer()}
const tabNames=['dashboard','customers','devices','cases','masters','troubleshooting','reports','settings'];
async function loadAdmin(){$('tabs').innerHTML=tabNames.map(x=>'<button class="tab" onclick="openTab(\''+x+'\')">'+x+'</button>').join('');openTab(currentTab)}
function table(rows){if(!rows?.length)return'<div class="muted">No records</div>';const k=Object.keys(rows[0]);return'<div class="tablewrap"><table class="table"><tr>'+k.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+k.map(x=>'<td>'+esc(typeof r[x]==='object'?JSON.stringify(r[x]):r[x])+'</td>').join('')+'</tr>').join('')+'</table></div>'}
async function openTab(x){currentTab=x;$('content').innerHTML='Loading...';try{if(x==='dashboard'){const d=await api('admin_dashboard');$('stats').innerHTML=[['Customers',d.customers],['Devices',d.devices],['Cases',d.cases],['Open',d.open_cases],['Resolved',d.resolved_cases],['Warranty',d.warranty_attention]].map(z=>'<div class="card stat"><div class="k">'+z[0]+'</div><strong>'+z[1]+'</strong></div>').join('');$('content').innerHTML='<h3>Recent Cases</h3>'+table(d.recent_cases);return}if(x==='customers'){const r=await api('admin_list',{type:'customers'});$('content').innerHTML='<div class="toolbar"><button class="btn" onclick="customerForm()">Add Customer</button></div>'+table(r.data);return}if(x==='devices'){const r=await api('admin_list',{type:'devices'});$('content').innerHTML='<div class="toolbar"><button class="btn" onclick="deviceForm()">Add Device</button><label class="btn secondary">Import Excel/CSV<input hidden type="file" accept=".xlsx,.xls,.csv" onchange="importExcel(this.files[0])"></label><button class="btn secondary" onclick="downloadReport(\'warranty\')">Warranty Excel</button></div>'+table(r.data);return}if(x==='cases'){const r=await api('admin_list',{type:'cases'});$('content').innerHTML='<div class="toolbar"><button class="btn secondary" onclick="downloadReport(\'cases\')">Cases Excel</button></div>'+table(r.data);return}if(x==='masters')return masters();if(x==='troubleshooting')return troubleshooting();if(x==='reports')return reports();if(x==='settings')return settings()}catch(e){$('content').innerHTML='<div class="muted">Error: '+esc(e.message)+'</div>'}}
function field(label,name,type='text'){return'<div class="field"><label>'+label+'</label><input data-f="'+name+'" type="'+type+'"></div>'}
function selectField(label,name,items){return'<div class="field"><label>'+label+'</label><select data-f="'+name+'">'+items.map(o=>'<option value="'+esc(o[0])+'">'+esc(o[1])+'</option>').join('')+'</select></div>'}
function showModal(html){$('modalBody').innerHTML=html;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}
function customerForm(){showModal('<h3>Add Customer</h3>'+field('Company','company_name')+field('Contact','contact_person')+field('Phone','phone')+field('Email','email')+'<button class="btn" onclick="saveRecord(\'customer\')">Save</button> <button class="btn secondary" onclick="closeModal()">Cancel</button>')}
async function deviceForm(){const [c,m]=await Promise.all([api('admin_list',{type:'customers'}),api('admin_list',{type:'models'})]);showModal('<h3>Add Device</h3>'+selectField('Customer','customer_id',c.data.map(x=>[x.id,x.company_name]))+selectField('Model','model_id',m.data.map(x=>[x.id,(x.brands?.name?x.brands.name+' ':'')+x.model_number]))+field('Serial','serial_number')+field('Warranty Start','warranty_start','date')+field('Warranty End','warranty_end','date')+field('Location','location')+'<button class="btn" onclick="saveRecord(\'device\')">Save</button> <button class="btn secondary" onclick="closeModal()">Cancel</button>')}
async function saveRecord(type){const row={};document.querySelectorAll('#modal [data-f]').forEach(x=>row[x.dataset.f]=x.value);await api('admin_save',{type,row});closeModal();openTab(type==='customer'?'customers':type==='device'?'devices':type==='guide'?'troubleshooting':'masters')}
async function masters(){const [c,b,m]=await Promise.all([api('admin_list',{type:'categories'}),api('admin_list',{type:'brands'}),api('admin_list',{type:'models'})]);window._cats=c.data;window._brands=b.data;$('content').innerHTML='<div class="toolbar"><button class="btn" onclick="simpleMaster(\'category\')">Add Category</button><button class="btn" onclick="simpleMaster(\'brand\')">Add Brand</button><button class="btn" onclick="modelForm()">Add Model</button></div><h3>Categories</h3>'+table(c.data)+'<h3>Brands</h3>'+table(b.data)+'<h3>Models</h3>'+table(m.data)}
function simpleMaster(type){showModal('<h3>Add '+type+'</h3>'+field('Name','name')+(type==='category'?field('Description','description'):'')+'<button class="btn" onclick="saveRecord(\''+type+'\')">Save</button> <button class="btn secondary" onclick="closeModal()">Cancel</button>')}
function modelForm(){showModal('<h3>Add Model</h3>'+selectField('Category','category_id',(window._cats||[]).map(x=>[x.id,x.name]))+selectField('Brand','brand_id',[['','-- Optional --'],...(window._brands||[]).map(x=>[x.id,x.name])])+field('Model No','model_number')+field('Product Name','product_name')+'<button class="btn" onclick="saveRecord(\'model\')">Save</button> <button class="btn secondary" onclick="closeModal()">Cancel</button>')}
async function troubleshooting(){const [g,c,m]=await Promise.all([api('admin_list',{type:'guides'}),api('admin_list',{type:'categories'}),api('admin_list',{type:'models'})]);window._cats=c.data;window._models=m.data;$('content').innerHTML='<div class="toolbar"><button class="btn" onclick="guideForm()">Add Guide</button></div>'+table(g.data)+'<div class="field"><input id="guideId" placeholder="Guide ID for steps"></div><button class="btn secondary" onclick="stepManager()">Manage Steps</button>'}
function guideForm(){showModal('<h3>Add Troubleshooting Guide</h3>'+selectField('Category','category_id',[['','-- Optional --'],...(window._cats||[]).map(x=>[x.id,x.name])])+selectField('Model','model_id',[['','-- Optional --'],...(window._models||[]).map(x=>[x.id,x.model_number])])+field('Issue Title','issue_title')+field('Keywords comma separated','issue_keywords')+selectField('Severity','severity',[['low','Low'],['medium','Medium'],['high','High'],['critical','Critical']])+'<button class="btn" onclick="saveRecord(\'guide\')">Save</button> <button class="btn secondary" onclick="closeModal()">Cancel</button>')}
async function stepManager(){const id=$('guideId').value.trim();if(!id)return;const r=await api('admin_get_steps',{guide_id:id});window._guide=id;const rows=r.data?.length?r.data:[{step_order:1,instruction:''}];showModal('<h3>Troubleshooting Steps</h3><div id="steps">'+rows.map(stepRow).join('')+'</div><div class="toolbar"><button class="btn secondary" onclick="addStep()">+ Step</button><button class="btn" onclick="saveSteps()">Save</button></div>')}
function stepRow(s){return'<div class="info step"><div class="two"><div class="field"><label>Order</label><input data-n="step_order" type="number" value="'+esc(s.step_order||'')+'"></div><div class="field"><label>Instruction</label><input data-n="instruction" value="'+esc(s.instruction||'')+'"></div></div><div class="two"><div class="field"><label>Yes next</label><input data-n="yes_next_step" type="number" value="'+esc(s.yes_next_step||'')+'"></div><div class="field"><label>No next</label><input data-n="no_next_step" type="number" value="'+esc(s.no_next_step||'')+'"></div></div><label><input data-n="resolves_case" type="checkbox" '+(s.resolves_case?'checked':'')+'> Resolves case</label> <label><input data-n="escalation_on_fail" type="checkbox" '+(s.escalation_on_fail?'checked':'')+'> Escalate on No</label></div>'}
function addStep(){$('steps').insertAdjacentHTML('beforeend',stepRow({step_order:document.querySelectorAll('.step').length+1,instruction:''}))}
async function saveSteps(){const rows=[...document.querySelectorAll('.step')].map(r=>({step_order:r.querySelector('[data-n="step_order"]').value,instruction:r.querySelector('[data-n="instruction"]').value,yes_next_step:r.querySelector('[data-n="yes_next_step"]').value,no_next_step:r.querySelector('[data-n="no_next_step"]').value,resolves_case:r.querySelector('[data-n="resolves_case"]').checked,escalation_on_fail:r.querySelector('[data-n="escalation_on_fail"]').checked}));await api('admin_save_steps',{guide_id:window._guide,steps:rows});closeModal();alert('Saved')}
async function reports(){const r=await api('admin_list',{type:'report_settings'});$('content').innerHTML='<h3>Automatic Reports</h3>'+r.data.map(s=>'<div class="info"><b>'+esc(s.report_type)+'</b><div class="field"><label>Recipients</label><input id="em_'+s.id+'" value="'+esc((s.recipient_emails||[]).join(','))+'"></div><div class="field"><label>Enabled</label><select id="en_'+s.id+'"><option value="true" '+(s.enabled?'selected':'')+'>Yes</option><option value="false" '+(!s.enabled?'selected':'')+'>No</option></select></div>'+(s.report_type==='warranty_expiry'?'<div class="field"><label>Days before expiry</label><input id="dy_'+s.id+'" type="number" value="'+(s.days_before_expiry||30)+'"></div>':'')+'<button class="btn secondary" onclick="saveReportSetting(\''+s.id+'\')">Save</button></div>').join('')+'<button class="btn" onclick="runReports()">Run Reports Now</button>'}
async function saveReportSetting(id){await api('admin_update_report_setting',{id,enabled:$('en_'+id).value==='true',recipient_emails:$('em_'+id).value,days_before_expiry:$('dy_'+id)?.value});alert('Saved')}
async function runReports(){alert(JSON.stringify(await api('admin_run_reports'),null,2))}
async function settings(){const r=await api('admin_get_settings'),s=r.data;$('content').innerHTML='<h3>Settings</h3><div class="field"><label>Company</label><input id="company" value="'+esc(s.company_name||'')+'"></div><div class="field"><label>Support Email</label><input id="supportEmail" value="'+esc(s.support_email||'')+'"></div><div class="field"><label>Support Phone</label><input id="supportPhone" value="'+esc(s.support_phone||'')+'"></div><div class="field"><label>Sender Email</label><input id="senderEmail" value="'+esc(s.sender_email||'')+'"></div><div class="field"><label>Email API Key (Resend)</label><input id="emailKey" type="password"></div><div class="field"><label>New Admin Password</label><input id="newPassword" type="password"></div><button class="btn" onclick="saveSettings()">Save</button>'}
async function saveSettings(){await api('admin_settings',{company_name:$('company').value,support_email:$('supportEmail').value,support_phone:$('supportPhone').value,sender_email:$('senderEmail').value,email_api_key:$('emailKey').value,new_admin_password:$('newPassword').value});alert('Saved')}
async function importExcel(file){if(!file)return;const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});let done=0,errs=[];for(let i=0;i<rows.length;i+=100){const r=await api('admin_import',{rows:rows.slice(i,i+100)});done+=r.processed;errs=errs.concat(r.errors||[])}alert('Imported/updated '+done+'; errors '+errs.length);openTab('devices')}
async function downloadReport(type){const r=await api('admin_report',{type});const ws=XLSX.utils.json_to_sheet(r.data),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Report');XLSX.writeFile(wb,type+'-report.xlsx')}
$('input').addEventListener?.('keydown',()=>{});$('input');$('input');
$('input');document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()});
initChat();if(token){api('admin_dashboard').then(()=>{$('customer').classList.add('hidden');$('adminView').classList.remove('hidden');loadAdmin()}).catch(()=>{token='';localStorage.removeItem('smartTechToken')})}
</script>
</body></html>
